services:
  # Python ML Prediction Service (server.py)
  ml-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: softeng-ml-server
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: softeng-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_PREDICTION_API_URL=http://localhost:5000/predict
    depends_on:
      ml-server:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - sqlite-data:/app/prisma

volumes:
  sqlite-data:
